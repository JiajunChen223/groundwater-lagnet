seed: 2022
device: cuda
data:
  dataset_name: bc_pgown128
  raw_path: data/raw/bc_pgown128/bc_pgown128_daily.csv
  processed_dir: data/processed/bc_pgown128_d90_h30_seq_topk15
  date_col: date
  station_col: site_no
  target_col: gwl
  target_unit_to_cm: 1.0
  feature_cols:
  - gwl
  - prcp
  - pet_proxy
  - month_sin
  - month_cos
  input_window: 90
  horizons:
  - 30
  split_ratio:
  - 0.7
  - 0.1
  - 0.2
  fill_method: interpolate
  scale_method: standard
graph:
  type: corr_learned
  topk: 15
  alpha: 0.3
model:
  name: lag_stgnet
  d_model: 64
  hidden_size: 64
  num_layers: 3
  dropout: 0.1
  kernel_size: 3
  input_window: 90
  individual: false
  nhead: 4
  diffusion_steps: 2
  hops: 2
  lag_kernels:
  - 3
  - 7
  - 14
  - 30
  lag_feature_cols:
  - prcp
  - pet_proxy
  lag_type: station
  use_lag: true
  use_graph: true
  use_learned_adj: true
  residual_connection: false
  target_index: 0
train:
  batch_size: 32
  epochs: 80
  lr: 0.001
  weight_decay: 0.0001
  patience: 12
  loss: huber
  num_workers: 0
output:
  save_dir: outputs/bc_pgown128/seq30/lag_stgnet_k4
